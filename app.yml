info:
  name: FFQ Extractor
  slug: ffq-extractor
  type: EXTRACTOR
  shortDescription: Convert FFQ Excel (or a ZIP of many) into microbiome Nutrition CSV rows.
  longDescription: >
    EXTRACTOR tool that turns food-frequency questionnaire Excel workbooks into a flat
    Nutrition CSV. Accepts a single .xlsx or a .zip of many per-patient workbooks.
    Outputs nutrition_csv.
  sourceUrl: https://github.com/FedLearnNet/ffq-extractor
config:
  hyperparams:
    - name: workers
      type: INTEGER
      description: Process-pool size for ZIP batch extraction (ignored for a single .xlsx).
      default: 4
      minValue: 1
      maxValue: 64
    - name: strict
      type: BOOLEAN
      description: Treat warn-level anomalies (odd marks, NA-mapped items) as errors.
      default: false
    - name: sheet
      type: STRING
      description: Worksheet name containing the FFQ matrix.
      default: Sheet1
  input:
    - name: ffq_archive
      type: PATH
      required: true
      description: >
        A filled FFQ .xlsx workbook, or a .zip archive containing many
        per-patient FFQ Excel files (nested folders allowed).
  output:
    - name: nutrition_csv
      type: CSV
      description: Combined Nutrition rows (one row per marked food item).
      hasHeader: true
      delimiter: ","
